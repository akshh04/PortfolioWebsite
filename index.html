<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" id="favicon" href="/favicon-dark.png" />
    <link rel="apple-touch-icon" href="/favicon-dark.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Akash Sankar — Astrophysics Researcher</title>
    <meta name="description" content="Portfolio of Akash Sankar Vigneshwaran — Astrophysics Researcher specializing in Dark Matter, Galaxy Dynamics, and Radio Astronomy Instrumentation." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('theme');
          var theme = stored || (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
            var root = document.documentElement;
            var fav = document.getElementById('favicon');
            if (theme === 'light') {
              root.classList.add('light');
              root.classList.remove('dark');
              if (fav) fav.href = '/favicon-light.png';
            } else {
              root.classList.remove('light');
              root.classList.add('dark');
              if (fav) fav.href = '/favicon-dark.png';
            }
          } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <!-- Astrophysics preloader: shown instantly before React loads; OUTSIDE #root so React never removes it -->
    <div id="preloader" role="status" aria-live="polite" aria-label="Loading portfolio">
        <style>
          #preloader {
            position: fixed;
            inset: 0;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #05060d;
            overflow: hidden;
            font-family: 'Space Grotesk', sans-serif;
          }

          /* ─── Star field ─────────────────────────────── */
          .pl-stars {
            position: absolute;
            inset: 0;
            pointer-events: none;
          }
          .pl-star {
            position: absolute;
            border-radius: 50%;
            background: #fff;
            animation: pl-twinkle var(--d, 2.5s) ease-in-out var(--dl, 0s) infinite alternate;
          }
          @keyframes pl-twinkle {
            from { opacity: 0.06; transform: scale(0.7); }
            to   { opacity: 0.95; transform: scale(1.5); }
          }

          /* ─── Solar system container ─────────────────── */
          .pl-solar {
            position: relative;
            width: 220px;
            height: 220px;
            perspective: 800px;
            transform-style: preserve-3d;
          }

          /* ─── Central star (sun) ─────────────────────── */
          .pl-sun {
            position: absolute;
            top: 50%; left: 50%;
            width: 22px; height: 22px;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle at 38% 32%, #fff5b0, #fbbf24 45%, #d97706 80%);
            border-radius: 50%;
            z-index: 10;
            box-shadow:
              0 0 0   5px rgba(251,191,36,0.12),
              0 0 20px 7px rgba(251,191,36,0.50),
              0 0 55px 18px rgba(251,191,36,0.22),
              0 0 110px 35px rgba(251,191,36,0.10);
            animation: pl-sun-pulse 2.4s ease-in-out infinite;
          }
          @keyframes pl-sun-pulse {
            0%, 100% {
              box-shadow:
                0 0 0   5px rgba(251,191,36,0.12),
                0 0 20px 7px rgba(251,191,36,0.50),
                0 0 55px 18px rgba(251,191,36,0.22),
                0 0 110px 35px rgba(251,191,36,0.10);
            }
            50% {
              box-shadow:
                0 0 0   7px rgba(251,191,36,0.18),
                0 0 30px 12px rgba(251,191,36,0.65),
                0 0 75px 26px rgba(251,191,36,0.30),
                0 0 140px 50px rgba(251,191,36,0.14);
            }
          }

          /*
           * ─── Orbit rings ─────────────────────────────────────────
           * KEY FIX: CSS custom properties (var()) do NOT work inside
           * @keyframes rules in any browser. The old code used
           * var(--rx) / var(--ry) inside @keyframes which silently fails.
           *
           * SOLUTION — two-element pattern:
           *   .pl-orbit-tilt  → holds the 3-D static tilt  (no animation)
           *   .pl-orbit-spin  → holds the Z-rotation animation (no tilt)
           * This separates the two transforms so both work correctly.
           */
          .pl-orbit-tilt {
            position: absolute;
            inset: 0;
            transform-style: preserve-3d;
          }
          .pl-orbit-spin {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 1px solid transparent; /* overridden per-orbit */
            transform-style: preserve-3d;
          }

          /* Orbit 1 — outermost, tilted, purple planet, clockwise */
          .pl-tilt-1 { transform: rotateX(68deg) rotateY(12deg); }
          .pl-spin-1 {
            inset: 4px;
            border-color: rgba(124, 58, 237, 0.38);
            animation: pl-cw 5s linear infinite;
          }

          /* Orbit 2 — middle, different tilt, blue planet, counter-clockwise */
          .pl-tilt-2 { transform: rotateX(50deg) rotateY(-20deg); }
          .pl-spin-2 {
            inset: 36px;
            border-color: rgba(37, 99, 235, 0.32);
            animation: pl-ccw 8s linear infinite;
          }

          /* Orbit 3 — innermost, steeper tilt, cyan planet, clockwise */
          .pl-tilt-3 { transform: rotateX(74deg) rotateY(6deg); }
          .pl-spin-3 {
            inset: 64px;
            border-color: rgba(6, 182, 212, 0.32);
            animation: pl-cw 3.5s linear infinite;
          }

          /* Plain Z-rotation keyframes — no CSS variables, always work */
          @keyframes pl-cw  { to { transform: rotate(360deg);  } }
          @keyframes pl-ccw { to { transform: rotate(-360deg); } }

          /* ─── Planet dot sits at the top of its ring ─── */
          .pl-planet {
            position: absolute;
            top: 0; left: 50%;
            border-radius: 50%;
          }
          .pl-spin-1 .pl-planet {
            width: 9px; height: 9px;
            margin-top: -4.5px; margin-left: -4.5px;
            background: radial-gradient(circle at 35% 30%, #c4b5fd, #7c3aed);
            box-shadow: 0 0 10px 3px rgba(124, 58, 237, 0.75);
          }
          .pl-spin-2 .pl-planet {
            width: 7px; height: 7px;
            margin-top: -3.5px; margin-left: -3.5px;
            background: radial-gradient(circle at 35% 30%, #93c5fd, #2563eb);
            box-shadow: 0 0 8px 2px rgba(37, 99, 235, 0.75);
          }
          .pl-spin-3 .pl-planet {
            width: 5px; height: 5px;
            margin-top: -2.5px; margin-left: -2.5px;
            background: radial-gradient(circle at 35% 30%, #a5f3fc, #06b6d4);
            box-shadow: 0 0 7px 2px rgba(6, 182, 212, 0.75);
          }

          /* ─── Text ──────────────────────────────────── */
          .pl-title {
            margin-top: 32px;
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: rgba(209, 213, 219, 0.75);
            animation: pl-breathe 2.8s ease-in-out infinite;
          }
          .pl-sub {
            margin-top: 8px;
            font-size: 0.58rem;
            letter-spacing: 0.32em;
            text-transform: uppercase;
            color: rgba(124, 58, 237, 0.55);
          }
          @keyframes pl-breathe {
            0%, 100% { opacity: 0.4; }
            50%      { opacity: 1;   }
          }

          /*
           * ─── Progress bar ─────────────────────────────────────────
           * Animating `width` in @keyframes is not GPU-accelerated and
           * can be unreliable — transform:scaleX() with
           * transform-origin:left is smooth and always works.
           *
           * The bar must never claim "done" while chunks are still
           * downloading, so it fills to 92% and then creeps slowly.
           * It only snaps to 100% when React adds .pl-exit, i.e. when
           * loading has actually finished.
           */
          .pl-track {
            margin-top: 26px;
            width: 160px;
            height: 2px;
            background: rgba(255, 255, 255, 0.07);
            border-radius: 2px;
            overflow: hidden;
          }
          .pl-bar {
            width: 100%;
            height: 100%;
            border-radius: 2px;
            background: linear-gradient(90deg, #7c3aed, #2563eb, #06b6d4);
            transform-origin: left center;
            transform: scaleX(0);
            animation:
              pl-progress 2.2s cubic-bezier(0.2, 0, 0.2, 1) forwards,
              pl-creep 6s 2.2s ease-in-out infinite alternate;
          }
          @keyframes pl-progress {
            0%   { transform: scaleX(0);    opacity: 0.7; }
            70%  { transform: scaleX(0.74); opacity: 1;   }
            100% { transform: scaleX(0.92); opacity: 1;   }
          }
          /* Keeps the bar alive on slow connections instead of freezing */
          @keyframes pl-creep {
            from { transform: scaleX(0.92); }
            to   { transform: scaleX(0.97); }
          }
          /* Loading genuinely finished — complete the bar */
          #preloader.pl-exit .pl-bar {
            animation: pl-finish 0.3s ease forwards;
          }
          @keyframes pl-finish {
            from { transform: scaleX(0.95); }
            to   { transform: scaleX(1);    }
          }

          /*
           * ─── Exit animation ───────────────────────────────────────
           * KEY FIX: The old code used animationend to remove the
           * preloader, but animationend fires for EVERY child animation
           * (stars, orbits, etc.) so .remove() was called immediately.
           * React now uses a plain setTimeout(700) to remove the element
           * after the fade completes. pointer-events:none prevents clicks.
           */
          #preloader.pl-exit {
            animation: pl-fadeout 0.65s ease forwards;
            pointer-events: none;
          }
          @keyframes pl-fadeout {
            from { opacity: 1; }
            to   { opacity: 0; }
          }

          /* ─── Light Mode theme override for preloader ─── */
          html.light #preloader {
            background: #fafafa;
          }
          html.light .pl-star {
            background: #6d28d9;
          }
          html.light .pl-spin-1 {
            border-color: rgba(109, 40, 217, 0.28);
          }
          html.light .pl-spin-2 {
            border-color: rgba(29, 78, 216, 0.22);
          }
          html.light .pl-spin-3 {
            border-color: rgba(8, 145, 178, 0.22);
          }
          html.light .pl-title {
            color: #111827;
          }
          html.light .pl-sub {
            color: #6d28d9;
          }
          html.light .pl-track {
            background: rgba(0, 0, 0, 0.08);
          }
          /*
           * The dark-mode sun glow is tuned for a near-black backdrop.
           * On #fafafa the same spread bleaches the whole centre of the
           * screen, so light mode gets a tighter, deeper-toned glow.
           */
          html.light .pl-sun {
            background: radial-gradient(circle at 38% 32%, #fde68a, #f59e0b 45%, #b45309 80%);
            box-shadow:
              0 0 0  3px rgba(217, 119, 6, 0.18),
              0 0 12px 3px rgba(217, 119, 6, 0.35),
              0 0 28px 8px rgba(217, 119, 6, 0.16);
            animation: none;
          }

          /*
           * ─── Reduced motion ───────────────────────────────────────
           * These styles are inline, so they apply from the very first
           * paint — index.css is fetched later and cannot cover the
           * preloader's own animations in time.
           */
          @media (prefers-reduced-motion: reduce) {
            #preloader *,
            #preloader {
              animation: none !important;
            }
            .pl-star  { opacity: 0.5; }
            .pl-title { opacity: 1;   }
            .pl-bar   { transform: scaleX(1); }
            /* animation is off, so fade out via transition instead */
            #preloader {
              transition: opacity 0.2s linear;
            }
            #preloader.pl-exit {
              opacity: 0;
            }
          }
        </style>

        <!-- Star field: 20 stars with varied sizes/delays -->
        <div class="pl-stars">
          <div class="pl-star" style="width:2px;height:2px;top:7%;left:13%;--d:2.1s;--dl:0s"></div>
          <div class="pl-star" style="width:3px;height:3px;top:14%;left:84%;--d:2.7s;--dl:0.4s"></div>
          <div class="pl-star" style="width:2px;height:2px;top:23%;left:41%;--d:1.9s;--dl:1.1s"></div>
          <div class="pl-star" style="width:2px;height:2px;top:34%;left:67%;--d:3.2s;--dl:0.7s"></div>
          <div class="pl-star" style="width:1px;height:1px;top:47%;left:17%;--d:2.5s;--dl:0.2s"></div>
          <div class="pl-star" style="width:2px;height:2px;top:51%;left:91%;--d:2.3s;--dl:1.5s"></div>
          <div class="pl-star" style="width:3px;height:3px;top:61%;left:54%;--d:2.8s;--dl:0.6s"></div>
          <div class="pl-star" style="width:2px;height:2px;top:69%;left:29%;--d:3.0s;--dl:1.0s"></div>
          <div class="pl-star" style="width:1px;height:1px;top:77%;left:74%;--d:2.2s;--dl:0.3s"></div>
          <div class="pl-star" style="width:2px;height:2px;top:87%;left:44%;--d:2.6s;--dl:1.4s"></div>
          <div class="pl-star" style="width:2px;height:2px;top:5%;left:54%;--d:3.1s;--dl:0.8s"></div>
          <div class="pl-star" style="width:3px;height:3px;top:41%;left:6%;--d:2.0s;--dl:1.7s"></div>
          <div class="pl-star" style="width:1px;height:1px;top:91%;left:16%;--d:2.4s;--dl:0.9s"></div>
          <div class="pl-star" style="width:2px;height:2px;top:19%;left:94%;--d:2.9s;--dl:1.2s"></div>
          <div class="pl-star" style="width:2px;height:2px;top:64%;left:9%;--d:2.6s;--dl:0.5s"></div>
          <div class="pl-star" style="width:3px;height:3px;top:81%;left:91%;--d:3.3s;--dl:1.6s"></div>
          <div class="pl-star" style="width:1px;height:1px;top:32%;left:3%;--d:2.4s;--dl:0.1s"></div>
          <div class="pl-star" style="width:2px;height:2px;top:58%;left:72%;--d:1.8s;--dl:1.3s"></div>
          <div class="pl-star" style="width:2px;height:2px;top:10%;left:28%;--d:3.0s;--dl:0.9s"></div>
          <div class="pl-star" style="width:1px;height:1px;top:75%;left:50%;--d:2.1s;--dl:1.9s"></div>
        </div>

        <!-- Solar system: tilt wrapper + spin child pattern -->
        <div class="pl-solar">
          <!-- Orbit 1: outermost, purple -->
          <div class="pl-orbit-tilt pl-tilt-1">
            <div class="pl-orbit-spin pl-spin-1">
              <div class="pl-planet"></div>
            </div>
          </div>
          <!-- Orbit 2: middle, blue -->
          <div class="pl-orbit-tilt pl-tilt-2">
            <div class="pl-orbit-spin pl-spin-2">
              <div class="pl-planet"></div>
            </div>
          </div>
          <!-- Orbit 3: innermost, cyan -->
          <div class="pl-orbit-tilt pl-tilt-3">
            <div class="pl-orbit-spin pl-spin-3">
              <div class="pl-planet"></div>
            </div>
          </div>
          <!-- Central sun -->
          <div class="pl-sun"></div>
        </div>

        <div class="pl-title">Mapping the Cosmos</div>
        <div class="pl-sub">Akash Portfolio</div>
        <div class="pl-track"><div class="pl-bar"></div></div>
      </div>
    <!-- React app root outside preloader -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
