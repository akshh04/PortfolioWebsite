<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" id="favicon" href="/favicon-dark.png" />
    <link rel="apple-touch-icon" href="/favicon-dark.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <title>Akash Sankar — Astrophysics Researcher</title>
    <meta name="description" content="Portfolio of Akash Sankar Vigneshwaran — M.Sc. Physics at the University of Bremen, researching dark matter, galaxy dynamics, and radio astronomy instrumentation." />
    <meta name="author" content="Akash Sankar Vigneshwaran" />
    <link rel="canonical" href="https://akashsankar.in/" />

    <!--
      Paints the browser chrome to match the page instead of leaving a white
      strip above a near-black site. Two entries so the bar follows the theme.
    -->
    <meta name="theme-color" content="#05060d" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />

    <!--
      Open Graph / Twitter card. A portfolio's whole job is to be shared —
      on LinkedIn, in an email, in a message to a supervisor. Without these
      every one of those links unfurled as a bare URL with no title, no
      description and no image.
    -->
    <meta property="og:type" content="profile" />
    <meta property="og:url" content="https://akashsankar.in/" />
    <meta property="og:site_name" content="Akash Sankar" />
    <meta property="og:title" content="Akash Sankar Vigneshwaran — Astrophysics Researcher" />
    <meta property="og:description" content="M.Sc. Physics at the University of Bremen. Research in dark matter, galaxy rotation curves, and radio astronomy instrumentation." />
    <meta property="og:image" content="https://akashsankar.in/logo-dark.jpg" />
    <meta property="og:locale" content="en_GB" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Akash Sankar Vigneshwaran — Astrophysics Researcher" />
    <meta name="twitter:description" content="M.Sc. Physics at the University of Bremen. Research in dark matter, galaxy rotation curves, and radio astronomy instrumentation." />
    <meta name="twitter:image" content="https://akashsankar.in/logo-dark.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('theme');
          var theme = (stored === 'light' || stored === 'dark') ? stored : (stored === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
            var root = document.documentElement;
            var fav = document.getElementById('favicon');
            if (theme === 'light') {
              root.classList.add('light');
              root.classList.remove('dark');
              if (fav) fav.href = '/favicon-light.png';
            } else {
              root.classList.remove('light');
              root.classList.add('dark');
              if (fav) fav.href = '/favicon-dark.png';
            }
          } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <noscript><p style="padding:2rem;font-family:sans-serif">Akash Sankar Vigneshwaran — Astrophysics Researcher. Enable JavaScript to explore this portfolio, or <a href="mailto:akashsankarv@gmail.com">contact Akash by email</a>.</p></noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
